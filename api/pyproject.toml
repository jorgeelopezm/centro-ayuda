[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "centro-ayuda-api"
version = "0.1.0"
description = "Backend del Centro de Ayuda: API de contenido bilingüe, CRUD de artículos y autenticación del panel interno."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=43",
    "anthropic>=0.40",
    "openai>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: harness EDD del chat con RAG (opt-in; se ejecuta con `pytest -m eval`).",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]
